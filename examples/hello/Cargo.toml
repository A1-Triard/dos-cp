[package]
edition = "2021"
name = "hello"
version = "0.0.0"
publish = false

[profile.dev]
panic = "abort"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[dependencies]
dos-cp = { path = "../.." }
exit-no-std = "0.3.0"
panic-no-std = "0.2.0"
rlibc-ext = "0.3.1"

[build-dependencies]
dos-cp-generator = { path = "../../generator" }
